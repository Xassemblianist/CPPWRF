# L90NSMK: NSMK's physics (configs/real_nsmk_r8.ini) with e_vert = 90 (89 layers; real.exe on the P4 met_em
# files makes the input); WRF v4.8.0 reference run ${CPPWRF_WRF_RUNS}/run_L90NSMK_r8 (10 min, history every 5 min;
# steps/ = 3 minutes, history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_L90NSMK_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qh,qndrop,qnr,qni,qns,qng,qnh,qnn,qvolg,qvolh
[phys]
mp_physics = 18
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 11
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 1
out_interval = 1
