# N3D50: N3 (configs/real_n3.ini: two-way nest, d02 5 km, ratio 3, the P4 physics on both domains) with d01's
# dt = 50 s, so the nest's is 50/3 s (WRF's clock: 16 + 2/3 s), against the WRF run N3D50_r8 (real*8, 1 h,
# history every 10 min on both domains). WRF's clock values (XTIME, julian) are those of the exact time.
[run]
case = real
run_time = 3600

[real]
dir = ${CPPWRF_WRF_RUNS}/run_N3D50_r8
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 50

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_N3D50_r8

[output]
dir = out/real_n3d50
format = native
out_interval = 12
diag_interval = 12

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
