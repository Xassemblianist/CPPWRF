# ADGT: P8 (Grell-Freitas-Li, ishallow 1, YSU, no microphysics or radiation) with the adaptive time step,
# target_cfl = 1.0, cudt = 5 and bldt = 3 (stepping to the history times); WRF v4.8.0 r8d8 reference run
# ${CPPWRF_WRF_RUNS}/run_ADGT_r8 (inputs of run_P8_r8; 20 min, history every 10 min; steps/ = 3 minutes).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_ADGT_r8/steps
[time]
dt = 60
adaptive = true
history_interval_s = 60
target_cfl = 1.0
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 3
ishallow = 1
cudt = 5
num_soil_layers = 4
bldt = 3
[output]
diag_interval = 1
out_interval = 1000000000
