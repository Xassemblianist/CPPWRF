# CB53: P4 with cudt = 5 and bldt = 3 (Kain-Fritsch every 5 steps, sfclayrev / Noah / YSU every 3 steps);
# WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_CB53_r8 (inputs of run_P4_r8; 20 min, history every
# 10 min; steps/ = 3 minutes, history every step).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_CB53_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 5
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
bldt = 3
[output]
diag_interval = 1
out_interval = 1
