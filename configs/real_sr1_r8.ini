# SR1: P4 with slope_rad = 1 (TOPO_RAD_ADJ_DRVR: SWDOWN and GSW by the slope and the shadow) and topo_shading = 1
# (pre_radiation_driver's toposhad, shadlen 25 km), radt = 10: WRF v4.8.0 real*8 reference run
# ${CPPWRF_WRF_RUNS}/run_SR1_r8 (5 h from 00 UTC over Turkey: sunrise and shading near 03-04 UTC; history every 30 min,
# wrfrst at 150 min; steps/ = 3 minutes, history every step).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_SR1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 10
slope_rad = 1
topo_shading = 1
[output]
diag_interval = 1
out_interval = 1
