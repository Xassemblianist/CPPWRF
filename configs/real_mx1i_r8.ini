# MX1I: P6 (Thompson + Noah + YSU) with diff_opt = 1 / km_opt = 3 (3-D Smagorinsky), diff_6th_opt = 2
# (diff_6th_factor = 0.12), mix_isotropic = 1 and moist / scalar *_mix2_off and *_mix6_off; WRF v4.8.0 r8d8 reference
# run ${CPPWRF_WRF_RUNS}/run_MX1I_r8 (inputs of run_P6_r8; 10 min, history every 5 min; steps/ = 3 minutes, history
# every step).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_MX1I_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 3
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
mix_isotropic = 1
moist_mix2_off = true
scalar_mix2_off = true
moist_mix6_off = true
scalar_mix6_off = true
diff_6th_opt = 2
diff_6th_factor = 0.12
moist_adv_opt = 1
scalar_adv_opt = 1
hybrid_opt = 2
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 0
ra_lw_physics = 0
ra_sw_physics = 0
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
