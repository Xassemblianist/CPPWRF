# N3T: three domains, a nest of a nest (d01 15 km; d02 5 km, ratio 3, inside d01 as N3's; d03 1.67 km, ratio 3,
# 61 x 61 points inside d02 at (50, 35)), two-way feedback (d03 into d02, d02 into d01) with smooth_option 2, the P4
# physics (sfclayrev, Noah, YSU, Kain-Fritsch, WSM6, RRTMG LW/SW radt 1, diff_opt 1 / km_opt 4) on every domain,
# against the WRF run N3T_r8 (real*8, 1 h, history every 10 min on every domain; real.exe on WPS 4.6.0's met_em of
# the three domains; tests/verify/refs/nest3_refs.txt). run_N3T_r8/steps: 3 steps, history every d01 step.
# tools/wrf2cppwrf.py gives this configuration from that namelist.
[run]
case = real
run_time = 3600

[real]
dir = ${CPPWRF_WRF_RUNS}/run_N3T_r8
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_N3T_r8

[output]
dir = out/real_n3t
format = native
out_interval = 10
diag_interval = 10

[domains]
max_dom = 3
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 30
diag_interval = 30

[d03]
parent_id = 2
i_parent_start = 50
j_parent_start = 35
parent_grid_ratio = 3
parent_time_step_ratio = 3
wrfinput = wrfinput_d03
out_interval = 90
diag_interval = 90
