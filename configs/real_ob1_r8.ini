# OB1: P4 with observation nudging, obs_nudge_opt = 1 (wind, temperature and moisture, 6e-4 s-1, rinxy 240 km, a
# 40 min window, errors every 2 steps, until 6 h) toward the synthetic reports of OBS_DOMAIN101 (tests/data/obs,
# tools/obs_nudging/make_obs_domain.py): WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_OB1_r8 (1 h; steps/ =
# 3 minutes, history every step). The OB2 ... OB9 cases change the [fdda] options with --set. tools/wrf2cppwrf.py gives
# this configuration from that namelist.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_OB1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[fdda]
obs_nudge_opt = 1
max_obs = 1000
fdda_end = 360
obs_nudge_wind = 1
obs_coef_wind = 0.0006
obs_nudge_temp = 1
obs_coef_temp = 0.0006
obs_nudge_mois = 1
obs_coef_mois = 0.0006
obs_nudge_pstr = 0
obs_coef_pstr = 0
obs_rinxy = 240
obs_twindo = 0.6666667
obs_ionf = 2
obs_prt_freq = 1000
obs_no_pbl_nudge_uv = 0
obs_no_pbl_nudge_t = 0
obs_no_pbl_nudge_q = 0
obs_idynin = 0
obs_dtramp = 0
obs_sfc_scheme_horiz = 0
obs_sfc_scheme_vert = 0
obs_max_sndng_gap = 20
obs_sfcfact = 1
obs_sfcfacr = 1
obs_dpsmx = 7.5
obs_scl_neg_qv_innov = 0
[output]
diag_interval = 1
out_interval = 1
