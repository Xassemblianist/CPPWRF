# MYKR: MYNN (P6 + MYNN surface layer and EDMF PBL, icloud_bl 1) with Kain-Fritsch, cu_rad_feedback and RRTMG
# every step (radt 1: the KF and MYNN subgrid clouds in the radiation from the second step on); WRF v4.8.0 r8d8
# reference run ${CPPWRF_WRF_RUNS}/run_MYKR_r8 (inputs of run_P6_r8; 10 min, history every 5 min; steps/ = 3
# minutes, history every step).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_MYKR_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
hybrid_opt = 2
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 5
sf_surface_physics = 2
bl_pbl_physics = 5
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
cudt = 0
cu_rad_feedback = true
[output]
diag_interval = 1
out_interval = 1
