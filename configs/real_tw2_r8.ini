# TW2: P1 (sfclayrev + Noah + YSU) with topo_wind = 2 (YSU's wind correction factor from the subgrid terrain
# variance VAR): WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_TW2_r8 (1 h, history every 10 min, wrfrst at
# 30 min; steps/ = 3 minutes, history every step) on run_P1_r8's input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_TW2_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
topo_wind = 2
[output]
diag_interval = 1
out_interval = 1
