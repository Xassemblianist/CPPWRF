# WN3: the two-way nest N3 (d02 5 km, ratio 3, smooth_option 2, P4 physics on both domains) with moist_adv_opt = 4,
# scalar_adv_opt = 4 (positive-definite WENO) and momentum_adv_opt = 3 (WENO) on both domains.
# WRF v4.8.0 real*8 -double-8 reference run ${CPPWRF_WRF_RUNS}/run_WN3_r8 (inputs of run_N3h_r8; d02 history every 10 min too; 1 h, history every 10 min; steps/ = 3
# minutes, history every step; wrfref workflow of Xassemblianist/cppwrf-data, tag b05-weno).
[run]
case = real
run_time = 3600

[real]
dir = ${CPPWRF_WRF_RUNS}/run_WN3_r8
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 4
scalar_adv_opt = 4
momentum_adv_opt = 3

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_WN3_r8

[output]
dir = out/real_wn3
format = native
out_interval = 10
diag_interval = 10

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 30
diag_interval = 30
