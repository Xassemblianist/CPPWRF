# N3OW: the N3 nest (P4 physics on both domains) one-way (feedback = 0); WRF v4.8.0 real*8 reference run
# ${CPPWRF_WRF_RUNS}/run_N3OW_r8 (inputs of run_N3s_r8; 10 min, history every 5 min; steps/ = 3 parent
# steps, history every minute).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_N3OW_r8/steps
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 1
out_interval = 1
[domains]
max_dom = 2
feedback = 0
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3
[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 3
diag_interval = 3
