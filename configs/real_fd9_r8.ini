# FD9: P9 (Eta MYJSFC + Noah + MYJ PBL, qv only) with grid nudging as FD1 (fddagd_driver sets REGIME from PBLH for
# the surface layers other than 1, 5, 7, 91): WRF run ${CPPWRF_WRF_RUNS}/run_FD9_r8 (1 h; steps/ = 3 minutes).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_FD9_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
num_soil_layers = 4
[fdda]
grid_fdda = 1
gfdda_interval_m = 360
gfdda_end_h = 6
guv = 0.0003
gt = 0.0003
gq = 0.0003
fgdt = 0
fgdtzero = 0
if_no_pbl_nudging_uv = 0
if_no_pbl_nudging_t = 0
if_no_pbl_nudging_q = 0
if_zfac_uv = 0
k_zfac_uv = 0
if_zfac_t = 0
k_zfac_t = 0
if_zfac_q = 0
k_zfac_q = 0
if_ramping = 0
dtramp_min = 0
[output]
diag_interval = 1
out_interval = 1
