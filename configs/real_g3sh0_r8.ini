# G3SH0: P8 (sfclayrev + Noah + YSU, qv only) with Grell-3D (cu_physics = 5) and ishallow = 0 (shallow convection
# disabled); WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_G3SH0_r8 (inputs of run_P8_r8; 10 min, history
# every 5 min; steps/ = 3 minutes, history every step).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_G3SH0_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 5
ishallow = 0
cudt = 0
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
