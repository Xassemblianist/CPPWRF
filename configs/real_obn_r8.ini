# OBN: N3 (two-way nest, P4 physics on both domains) with observation nudging on both domains (OB1's options; d02:
# rinxy 80 km, obs_twindo 0 = domain 1's window, OBS_DOMAIN201 = a copy of OBS_DOMAIN101: the reports inside d02 are
# its own): WRF run ${CPPWRF_WRF_RUNS}/run_OBN_r8 (1 h; steps/ = 3 minutes, history every minute).
# tools/wrf2cppwrf.py gives this configuration from that namelist.
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_OBN_r8/steps
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_OBN_r8/steps

[output]
dir = out/real_obn_r8
format = native
out_interval = 1
diag_interval = 1

[fdda]
obs_nudge_opt = 1
max_obs = 1000
fdda_end = 360
obs_nudge_wind = 1
obs_coef_wind = 0.0006
obs_nudge_temp = 1
obs_coef_temp = 0.0006
obs_nudge_mois = 1
obs_coef_mois = 0.0006
obs_nudge_pstr = 0
obs_coef_pstr = 0
obs_rinxy = 240
obs_twindo = 0.6666667
obs_ionf = 2
obs_prt_freq = 1000
obs_no_pbl_nudge_uv = 0
obs_no_pbl_nudge_t = 0
obs_no_pbl_nudge_q = 0
obs_idynin = 0
obs_dtramp = 0
obs_sfc_scheme_horiz = 0
obs_sfc_scheme_vert = 0
obs_max_sndng_gap = 20
obs_sfcfact = 1
obs_sfcfacr = 1
obs_dpsmx = 7.5
obs_scl_neg_qv_innov = 0

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 3
diag_interval = 3
fdda_obs_rinxy = 80
fdda_obs_twindo = 0
