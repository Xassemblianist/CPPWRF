# MORR: P4 with the Morrison two-moment microphysics (mp_physics = 10, phys/module_mp_morr_two_moment.F; default
# morr_rimed_ice = 1: hail) and Kain-Fritsch (its rain, snow and ice tendencies RQRCUTEN, RQSCUTEN, RQICUTEN add rain,
# snow and ice number in Morrison): WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_MORR_r8 (1 h, wrfrst at
# 30 min; steps/ = 3 minutes, history every step), made from run_P4_r8's inputs. tools/wrf2cppwrf.py gives this
# configuration from that namelist.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_MORR_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qns,qnr,qng
[phys]
mp_physics = 10
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 1
out_interval = 1
