# RUCL: P4 in daylight (from 06 UTC) with the RUC LSM (sf_surface_physics = 3, 9 soil levels) and rdlai2d = true (2-D
# LAI from real.exe kept by SOILVEGIN); WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_RUCL_r8 (real.exe inputs
# from the P4 met_em files at 06 UTC; 10 min, history every 5 min; steps/ = 3 minutes, history every step).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_RUCL_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 3
bl_pbl_physics = 1
num_soil_layers = 9
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
rdlai2d = true
[output]
diag_interval = 1
out_interval = 1
