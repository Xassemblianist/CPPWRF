# M9: P9 (Eta MYJSFC + Noah + MYJ PBL, no microphysics, hybrid_opt = 2, w_damping = 1, damp_opt = 3, no
# diffusion) with the multi-scale Kain-Fritsch (cu_physics = 11), against the WRF v4.8.0 real*8 run M9_r8 (1 h,
# history every 10 min).
[run]
case = real
run_time = 3600
[real]
dir = ${CPPWRF_WRF_RUNS}/run_M9_r8
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
cu_physics = 11
num_soil_layers = 4
[output]
diag_interval = 10
out_interval = 10
