# RUC4: P4 (WSM6, Kain-Fritsch, RRTMG LW/SW, YSU, sfclayrev) with the RUC LSM (sf_surface_physics = 3, 9 soil
# levels) instead of Noah: WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_RUC4_r8 (1 h, history every 10 min;
# steps/ = 3 minutes, history every step) on real.exe's RUC input made from run_P4_r8's met_em files.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_RUC4_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 3
bl_pbl_physics = 1
num_soil_layers = 9
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 1
out_interval = 1
[cppwrf]
allow_unverified = true
