# P4D16: the P4 configuration (configs/real_p4_r8.ini) on the 72 h inputs of run_P4_72h_r8 with dt = 16 s and
# radt = 10 min (radiation every nint(600 / 16) = 38 steps, 608 s) for 30 h, history every hour (225 steps): WRF
# v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_P4D16_r8. Past one day WRF's clock values (XTIME =
# days*1440 + seconds/60) differ in the last bit from (itimestep - 1) * dt / 60, first at the radiation call of
# 27.7 h (coszen).
[run]
case = real
run_time = 108000
[real]
dir = ${CPPWRF_WRF_RUNS}/run_P4D16_r8
[time]
dt = 16
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 10
[output]
diag_interval = 225
out_interval = 225
