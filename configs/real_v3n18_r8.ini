# N18V: V3 (Alps, Lambert, 3 km convection-permitting, no cumulus, MYJ + Eta surface layer + Noah-MP + RRTMG
# (radt = 5), dt = 18 s) with the NSSL 2-moment microphysics (mp_physics = 18 with its defaults) instead of Thompson:
# WRF v4.8.0 real*8 (-fdefault-double-8 build) reference ${CPPWRF_WRF_RUNS}/run_N18V_r8 (30 min, history every 15
# min; steps/ = 3 steps, history every step), made from run_V3_r8's inputs. Noah-MP takes NSSL's HAILNCV.
[run]
case = real
run_time = 1800
[real]
dir = ${CPPWRF_WRF_RUNS}/run_N18V_r8
[time]
dt = 18
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qh,qndrop,qnr,qni,qns,qng,qnh,qnn,qvolg,qvolh
[phys]
mp_physics = 18
sf_sfclay_physics = 2
sf_surface_physics = 4
bl_pbl_physics = 2
num_soil_layers = 4
cu_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 5
[output]
diag_interval = 50
out_interval = 50
