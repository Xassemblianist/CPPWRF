# SKN: the N3 two-way nest (d01 + d02, P4 physics) with sst_skin = 1 and tmn_update = 1 (lagday = 5: TLAG has
# 5 levels in wrfrst) on both domains (one namelist value for all domains), against the WRF v4.8.0 real*8 run
# ${CPPWRF_WRF_RUNS}/run_SKN_r8 (1 h, history every 10 min, wrfrst every 30 min; steps/ = 3 minutes, history
# every minute), made from run_N3s_r8's inputs.
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_SKN_r8/steps
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
sst_skin = 1
tmn_update = 1
lagday = 5
table_dir = ${CPPWRF_WRF_RUNS}/run_SKN_r8/steps

[output]
dir = out/real_skn_r8
format = native
out_interval = 1
diag_interval = 1

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 3
diag_interval = 3
