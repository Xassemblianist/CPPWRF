# OB9: P9 (MYJ surface layer: fddaobs_driver sets REGIME from PBLH; no diffusion: grid%z from phy_prep) with OB1's
# observation nudging and OBS_DOMAIN101: WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_OB9_r8 (1 h; steps/ =
# 3 minutes, history every step). tools/wrf2cppwrf.py gives this configuration from that namelist.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_OB9_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
num_soil_layers = 4
[fdda]
obs_nudge_opt = 1
max_obs = 1000
fdda_end = 360
obs_nudge_wind = 1
obs_coef_wind = 0.0006
obs_nudge_temp = 1
obs_coef_temp = 0.0006
obs_nudge_mois = 1
obs_coef_mois = 0.0006
obs_nudge_pstr = 0
obs_coef_pstr = 0
obs_rinxy = 240
obs_twindo = 0.6666667
obs_ionf = 2
obs_prt_freq = 1000
obs_no_pbl_nudge_uv = 0
obs_no_pbl_nudge_t = 0
obs_no_pbl_nudge_q = 0
obs_idynin = 0
obs_dtramp = 0
obs_sfc_scheme_horiz = 0
obs_sfc_scheme_vert = 0
obs_max_sndng_gap = 20
obs_sfcfact = 1
obs_sfcfacr = 1
obs_dpsmx = 7.5
obs_scl_neg_qv_innov = 0
[output]
diag_interval = 1
out_interval = 1
