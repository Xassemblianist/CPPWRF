# ADCB: P4 (Kain-Fritsch, YSU) with the adaptive time step (as B01) and cudt = 5 / bldt = 2 (the cumulus and
# PBL calls on their elapsed-time alarms); WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_ADCB_r8 (inputs
# of run_P4_r8; 20 min, history every 10 min; steps/ = 3 minutes, history every minute).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_ADCB_r8/steps
[time]
dt = 60
adaptive = true
history_interval_s = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 5
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
bldt = 2
[output]
diag_interval = 1
out_interval = 1000000000
