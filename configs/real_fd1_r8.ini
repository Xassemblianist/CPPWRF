# FD1: P4 with grid (analysis) nudging, grid_fdda = 1 (PSUFDDAGD: guv = gt = gq = 3e-4 s-1 toward the analyses of
# wrffdda_d01, real.exe's auxinput10 file every 6 h, interpolated in time; nudging until 6 h): WRF v4.8.0 real*8
# reference run ${CPPWRF_WRF_RUNS}/run_FD1_r8 (1 h; steps/ = 3 minutes, history every step). The FD2 ... FD9 cases
# change the [fdda] options with --set. tools/wrf2cppwrf.py gives this configuration from that namelist.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_FD1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[fdda]
grid_fdda = 1
gfdda_interval_m = 360
gfdda_end_h = 6
guv = 0.0003
gt = 0.0003
gq = 0.0003
fgdt = 0
fgdtzero = 0
if_no_pbl_nudging_uv = 0
if_no_pbl_nudging_t = 0
if_no_pbl_nudging_q = 0
if_zfac_uv = 0
k_zfac_uv = 0
if_zfac_t = 0
k_zfac_t = 0
if_zfac_q = 0
k_zfac_q = 0
if_ramping = 0
dtramp_min = 0
[output]
diag_interval = 1
out_interval = 1
