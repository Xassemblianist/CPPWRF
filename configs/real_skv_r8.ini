# SKV: V1 (Bay of Bengal, P4 physics: sfclayrev + Noah + YSU + KF + WSM6 + RRTMG radt 1) with the skin SST
# (sst_skin = 1, without sst_update: the water points' TSK = SST, then the warm layer and cool skin of
# module_sf_sstskin.F; 00 UTC is sunrise there) and the deep soil temperature update (tmn_update = 1, lagday 150:
# the day's end at the first step of 00 UTC), against the WRF v4.8.0 real*8 run ${CPPWRF_WRF_RUNS}/run_SKV_r8
# (6 h, history every 30 min, wrfrst at 3 h and 6 h; steps/: history every step for 3 min).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_SKV_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
sst_skin = 1
tmn_update = 1
[output]
diag_interval = 1
out_interval = 1
