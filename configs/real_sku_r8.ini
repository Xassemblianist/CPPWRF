# SKU: SU1 (WRF's default real-data namelist on the V2 domain with sst_update = 1 and fractional sea ice:
# Thompson, Tiedtke, MYJ, Eta, Noah, RRTMG radt 15) with sst_skin = 1 (the sst_update branch: TSK = SST from
# wrflowinp, then the skin) and tmn_update = 1, against the WRF v4.8.0 real*8 -double-8 run
# ${CPPWRF_WRF_RUNS}/run_SKU_r8 (7 h, history every 30 min, the 6 h wrflowinp update included; steps/: history
# every step for 3 min).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_SKU_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
gwd_opt = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 2
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
cu_physics = 6
ra_lw_physics = 4
ra_sw_physics = 4
radt = 15
num_soil_layers = 4
fractional_seaice = 1
sst_update = 1
auxinput4_interval = 360
sst_skin = 1
tmn_update = 1
[output]
diag_interval = 1
out_interval = 1
