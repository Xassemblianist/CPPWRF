# NMPMY: P6 in daylight (from 06 UTC; Thompson + diff_opt 1 / km_opt 4) with Noah-MP (sf_surface_physics = 4), the
# MYNN surface layer and MYNN-EDMF PBL (sf_sfclay_physics = 5, bl_pbl_physics = 5, icloud_bl = 1) and RRTMG every step
# (radt = 1); WRF v4.8.0 r8d8 reference run ${CPPWRF_WRF_RUNS}/run_NMPMY_r8 (real.exe inputs from the P4 met_em files
# at 06 UTC; 10 min, history every 5 min; steps/ = 3 minutes, history every step).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_NMPMY_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
hybrid_opt = 2
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 5
sf_surface_physics = 4
bl_pbl_physics = 5
cu_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
[output]
diag_interval = 1
out_interval = 1
