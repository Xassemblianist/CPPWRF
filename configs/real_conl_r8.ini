# CONL: WRF's CONUS suite (physics_suite = 'CONUS': Thompson, Tiedtke, RRTMG radt 15, MYJ, Eta, Noah;
# fractional_seaice 1, gwd_opt 1 on d01, diff_opt 2 / km_opt 4, w_damping 0) on the two-way nest N3 (d02 5 km,
# ratio 3, smooth_option 2); WRF v4.8.0 r8d8 reference run ${CPPWRF_WRF_RUNS}/run_CONL_r8 (real.exe inputs from
# the N3 met_em files; 20 min, history every 10 min: the second radiation call at 15 min; steps/ = 3 parent
# steps, history every minute).
# tools/wrf2cppwrf.py gives this configuration from that run's namelist.input.
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_CONL_r8/steps
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
diff_opt = 2
km_opt = 4
w_damping = 0
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
gwd_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg,qni,qnr
[phys]
mp_physics = 8
sf_sfclay_physics = 2
sf_surface_physics = 2
bl_pbl_physics = 2
num_soil_layers = 4
cu_physics = 6
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 15
fractional_seaice = 1
[output]
diag_interval = 1
out_interval = 1
[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3
[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 3
diag_interval = 3
