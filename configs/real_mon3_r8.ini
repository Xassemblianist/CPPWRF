# MON3: the two-way nest N3 (d02 5 km, ratio 3, smooth_option 2, P4 physics on both domains) with moist_adv_opt = 2
# and scalar_adv_opt = 2 (monotonic advection) on both domains, against the WRF run MON3_r8 (real*8, 1 h; steps/ =
# 3 minutes, history every step; inputs of run_N3h_r8; wrfref workflow of Xassemblianist/cppwrf-data, tag b05-mono).
[run]
case = real
run_time = 3600

[real]
dir = ${CPPWRF_WRF_RUNS}/run_MON3_r8
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 2
scalar_adv_opt = 2

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_MON3_r8

[output]
dir = out/real_mon3
format = native
out_interval = 10
diag_interval = 10

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 30
diag_interval = 30
