# TW1: P1 (sfclayrev + Noah + YSU) with YSU's topographic wind correction topo_wind = 1 (Jimenez and Dudhia
# 2012; start_em's ctopo from VAR_SSO and the terrain Laplacian): WRF v4.8.0 real*8 reference run
# ${CPPWRF_WRF_RUNS}/run_TW1_r8 (1 h, history every 10 min, wrfrst at 30 min; steps/ = 3 minutes, history every step)
# on P1's wrfinput with VAR_SSO = VAR**2 (GOT_VAR_SSO = 1; real.exe sets it from a V4 met_em file with VAR_SSO).
[run]
case = real
run_time = 180
[real]
dir = ${CPPWRF_WRF_RUNS}/run_TW1_r8/steps
[time]
dt = 60
[dyn]
khdif = 0
kvdif = 0
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
[moist]
species = qv
[phys]
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
topo_wind = 1
[output]
diag_interval = 1
out_interval = 1
