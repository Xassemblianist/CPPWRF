# M3N: N3 (two-way nest, d02 5 km, ratio 3, smooth_option 2, the P4 physics on both domains) with the multi-scale
# Kain-Fritsch (cu_physics = 11, 11) instead of Kain-Fritsch, against the WRF v4.8.0 real*8 run M3N_r8 (1 h,
# history every 10 min on both domains).
[run]
case = real
run_time = 3600

[real]
dir = ${CPPWRF_WRF_RUNS}/run_M3N_r8
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 11
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_M3N_r8

[output]
dir = out/real_m3n
format = native
out_interval = 10
diag_interval = 10

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 30
diag_interval = 30
