# RSA: the P4 configuration (configs/real_p4_r8.ini) with dt = 50 s and a restart file every 2 min (120 s, not a
# multiple of dt), 700 s, history every 150 s: WRF v4.8.0 real*8 reference run ${CPPWRF_WRF_RUNS}/run_RSA_r8 (wrfrst
# files at 150, 250, 400, 500 and 600 s: ESMF_ClockAdvance rings at the first step past each multiple of the interval).
# A run resumed from its wrfrst file of 150 s rings first at 150 s + WRF_ALARM_SECS_TIL_NEXT_RING_51 (240 s: the step of
# 250 s) and counts the interval from there: rsm_RSA_r8 (250, 400, 500, 650 s); with restart_interval = 0 it still
# rings once there: rsm0_RSA_r8 (tests/verify/cases/68_restart_alarm.py).
[run]
case = real
run_time = 700
[real]
dir = ${CPPWRF_WRF_RUNS}/run_RSA_r8
[time]
dt = 50
[dyn]
khdif = 0
kvdif = 0
diff_opt = 1
km_opt = 4
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
moist_adv_opt = 1
scalar_adv_opt = 1
[moist]
species = qv,qc,qr,qi,qs,qg
[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
cu_physics = 1
cudt = 0
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
[output]
diag_interval = 3
out_interval = 3
[restart]
interval = 120
