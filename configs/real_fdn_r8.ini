# FDN: N3 (two-way nest, P4 physics on both domains) with grid nudging on both domains (d02: guv = 6e-4, its own
# wrffdda_d02 from real.exe): WRF run ${CPPWRF_WRF_RUNS}/run_FDN_r8 (1 h; steps/ = 3 minutes, history every minute).
# tools/wrf2cppwrf.py gives this configuration from that namelist.
[run]
case = real
run_time = 180

[real]
dir = ${CPPWRF_WRF_RUNS}/run_FDN_r8/steps
wrfinput = wrfinput_d01
wrfbdy = wrfbdy_d01

[time]
dt = 60

[dyn]
khdif = 0
kvdif = 0
w_damping = 1
damp_opt = 3
zdamp = 5000
dampcoef = 0.2
diff_opt = 1
km_opt = 4
moist_adv_opt = 1
scalar_adv_opt = 1

[moist]
species = qv,qc,qr,qi,qs,qg

[phys]
mp_physics = 6
sf_sfclay_physics = 1
sf_surface_physics = 2
bl_pbl_physics = 1
cu_physics = 1
ra_lw_physics = 4
ra_sw_physics = 4
radt = 1
num_soil_layers = 4
table_dir = ${CPPWRF_WRF_RUNS}/run_FDN_r8/steps

[output]
dir = out/real_fdn_r8
format = native
out_interval = 1
diag_interval = 1

[domains]
max_dom = 2
feedback = 1
smooth_option = 2
i_parent_start = 40
j_parent_start = 30
parent_grid_ratio = 3
parent_time_step_ratio = 3

[fdda]
grid_fdda = 1
gfdda_interval_m = 360
gfdda_end_h = 6
guv = 0.0003
gt = 0.0003
gq = 0.0003
fgdt = 0
fgdtzero = 0
if_no_pbl_nudging_uv = 0
if_no_pbl_nudging_t = 0
if_no_pbl_nudging_q = 0
if_zfac_uv = 0
k_zfac_uv = 0
if_zfac_t = 0
k_zfac_t = 0
if_zfac_q = 0
k_zfac_q = 0
if_ramping = 0
dtramp_min = 0

[d02]
wrfinput = wrfinput_d02
dt = 20
out_interval = 3
diag_interval = 3
fdda_guv = 0.0006
